<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidential Intake | HNTG</title>
    <link rel="stylesheet" href="master-forensic.css">
</head>
<body>

    <div class="intake-container">
        <div class="sub-head">Secure Intake Desk</div>
        <h1 style="margin-bottom: 12px; font-size: 1.8rem;">Asset Diagnostic Request</h1>
        <p>To initiate a commercial forensic review or turnaround sprint, please provide the initial details below. All submissions are strictly confidential.</p>

        <form action="https://formsubmit.co/david@hownottogain.co.uk" method="POST">
            
            <input type="hidden" name="_subject" value="Confidential Asset Diagnostic Request">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://hownottogain.co.uk/">
            <input type="text" name="_honey" style="display:none"> <div class="form-group">
                <label for="fund">Organization / Sponsor Name</label>
                <input type="text" id="fund" name="Organization" placeholder="e.g., Acme Agency, Dept of Health, or Providence Equity" required>
            </div>

            <div class="form-group">
                <label for="asset">Target Asset / Business Unit</label>
                <input type="text" id="asset" name="Target_Asset" placeholder="Which division or company needs the diagnostic?" required>
            </div>

            <div class="form-group">
                <label for="hold">Time Horizon / Hold Period</label>
                <input type="text" id="hold" name="Time_Horizon" placeholder="e.g., Year 4 of 5, Pre-Exit, or Q3 Board Review">
            </div>

            <div class="form-group">
                <label for="thesis">Primary Diagnostic Focus</label>
                <textarea id="thesis" name="Diagnostic_Focus" rows="3" placeholder="e.g., Margin compression, failed cross-sell, structural leadership void..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Initiate Diagnostic</button>
        </form>
    </div>

    <a href="index.html" class="back-link">← Return to Briefing Room</a>

</body>
</html>
