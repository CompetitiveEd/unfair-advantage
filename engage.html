<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confidential Intake | HNTG</title>
    <link rel="stylesheet" href="master-forensic.css">
</head>
<body>

    <div class="intake-container">
        <div class="sub-head">Secure Intake Desk</div>
        <h1 style="margin-bottom: 12px; font-size: 1.8rem;">Asset Diagnostic Request</h1>
        <p>To initiate a pre-DD commercial forensic review or a 90-day turnaround sprint, please provide the initial asset details below. All submissions are strictly confidential.</p>

        <form action="mailto:growth@hownottogain.co.uk?subject=Confidential%20Asset%20Diagnostic" method="POST" enctype="text/plain">
            
            <div class="form-group">
                <label for="fund">Sponsor / Fund Name</label>
                <input type="text" id="fund" name="Fund_Name" required>
            </div>

            <div class="form-group">
                <label for="asset">Target Asset / Portfolio Company</label>
                <input type="text" id="asset" name="Target_Asset" required>
            </div>

            <div class="form-group">
                <label for="hold">Current Hold Period / Time to Exit</label>
                <input type="text" id="hold" name="Hold_Period" placeholder="e.g., Year 4 of 5">
            </div>

            <div class="form-group">
                <label for="thesis">Primary Diagnostic Focus</label>
                <textarea id="thesis" name="Diagnostic_Focus" rows="3" placeholder="e.g., Margin compression, failed cross-sell, leadership void..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Initiate Diagnostic</button>
        </form>
    </div>

    <a href="index.html" class="back-link">← Return to Briefing Room</a>

</body>
</html>
