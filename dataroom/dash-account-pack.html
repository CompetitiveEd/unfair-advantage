                <div>
                  <h4 className="text-xs font-bold text-red-400 uppercase tracking-widest mb-3">Trauma Signatures (A-02)</h4>

                      "Project Aegis incident — 23-min response, 47-min comms blackout",

                        <span className="text-red-500 mt-0.5 shrink-0">▸</span>

                  { phase: "TUPE Transfer Day 1", date: "September 2026", status: "upcoming" },

                  <div className="text-[10px] text-red-400 font-bold uppercase">Critical</div>

                <div className="p-2 bg-amber-950 border border-amber-800 rounded">
                  <div className="text-[10px] text-amber-400 font-bold uppercase">Defend</div>
                  <div className="text-xs text-gray-400">1 criterion · 5.4%</div>
                </div>
              </div>
            </Section>
          </div>
        )}

        {/* ════════════════════════════════════════════════ */}

        {/* ════════════════════════════════════════════════ */}

          <div>
            <Section id="N-01" title="Expansion Signal Scan" subtitle="Post-win growth roadmap" defaultOpen={true}>
              <div className="mb-4 p-3 bg-emerald-950 border border-emerald-800 rounded text-sm text-emerald-300">
                Immediate post-win: £1.2M ISO 22301 Remediation-as-a-Service (GO signal). 3-12 months: Regulatory Advisory + HIO Full Deployment (£2.45M). Long-term: Renewal protection + portfolio bundle (£115M base). All expansions require Olowe/Mason champion pathway.

              <div className="space-y-2">
                {EXPANSION.map((e, i) => (
                  <div key={i} className="flex items-center gap-3 p-3 bg-gray-900 border border-gray-800 rounded">
                    <span className={`w-2.5 h-2.5 rounded-full shrink-0 ${
                      e.gate === "green" ? "bg-emerald-500" : e.gate === "amber" ? "bg-amber-400" : "bg-gray-600"

                    <div className="flex-1">
                      <span className="text-sm font-bold text-white">{e.signal}</span>
                      <div className="text-[11px] text-gray-500">Champion: {e.champion} · {e.timing}</div>
                    </div>
                    <span className="text-xs font-bold text-emerald-400">{e.revenue}</span>
                  </div>
                ))}
              </div>
            </Section>

            <Section id="N-01b" title="Competitive Defence" subtitle="Block competitor encroachment">
              <div className="bg-red-950 border border-red-800 rounded-lg p-4">
                <h4 className="text-sm font-bold text-red-400 uppercase mb-2">Critical: Block Vector on Application Services</h4>
                <p className="text-sm text-gray-300 mb-3">
                  If Vector wins application services contract, they're inside the account with a team, a relationship, and a platform to compete at renewal. Cost of inaction is existential.
                </p>
                <div className="bg-gray-900 border border-gray-800 rounded p-3">
                  <div className="text-xs font-bold text-blue-400 uppercase mb-1">Defensive Move</div>
                  <p className="text-sm text-gray-300">
                    Propose 90-day Application Discovery (£50-80K) as natural extension of cloud migration. Documents application dependencies, rationalisation opportunities. Makes Project Alpha the incumbent expert before Vector gets a meeting.
                  </p>
                </div>
              </div>
            </Section>

            <Section id="N-01c" title="Account Health (Simulated Mo 6)" subtitle="Earn-the-right assessment">
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                {[
                  { dim: "Alert Stabilisation", status: "green", detail: "14K → 4.5K alerts in 30 days, zero Chang team config" },
                  { dim: "Rebecca Owen Alignment", status: "green", detail: "Trusted advisor to Mason — Regulatory peer pathway active" },
                  { dim: "EOL Audit (Week 1)", status: "amber", detail: "Independent EOL audit complete — documented before SLA report" },
                  { dim: "CIO Kubler-Ross", status: "amber", detail: "Reed in Denial/Anger — Data Cleansing narrative holding" },
                  { dim: "Verbal Promise Risk", status: "amber", detail: "£250K verbal overrun promise NOT in contract — resolve before signature" },
                  { dim: "Champion Health", status: "green", detail: "Mason arming Olowe with business case — regulatory mandate channel open" },
                ].map((h, i) => (
                  <div key={i} className={`p-3 rounded border ${
                    h.status === "green" ? "bg-emerald-950 border-emerald-800" : "bg-amber-950 border-amber-800"
                  }`}>
                    <div className="flex items-center gap-2 mb-1">
                      <span className={`w-2 h-2 rounded-full ${h.status === "green" ? "bg-emerald-500" : "bg-amber-400"}`} />
                      <span className="text-xs font-bold text-white uppercase">{h.dim}</span>
                    </div>
                    <p className="text-[11px] text-gray-400">{h.detail}</p>
                  </div>
                ))}
              </div>
            </Section>
          </div>
        )}
      </div>

      {/* Footer */}
      <div className="border-t border-gray-800 px-6 py-3 text-center">
        <span className="text-[10px] text-gray-600 font-mono">
          GAIN Account Pack · Generated from G-01→N-01 intelligence chain · Last compiled: {ACCOUNT.lastUpdated} · Confidential
        </span>
      </div>
    </div>
  );
}

// Mount dashboard
window.mountDashboard = function() {
  var dashRoot = document.getElementById('gain-dashboard-root');
  if (dashRoot && !dashRoot._mounted) {
    ReactDOM.createRoot(dashRoot).render(React.createElement(GAINAccountPack));
    dashRoot._mounted = true;
  }
};
// Try mount now
setTimeout(function() { if (window.mountDashboard) window.mountDashboard(); }, 100);
</script>
