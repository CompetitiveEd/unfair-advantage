<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #020617; 
  --s1: #0f172a; 
  --border: rgba(255,255,255,0.15);
  --white: #ffffff;
  --silver: #e2e8f0;
  --dim: #94a3b8; /* Brightened for legibility */
  --red: #ff4d4d;      
  --gold: #fbbf24;     
  --blue: #60a5fa;     
  --green: #22c55e;
  --purple: #a855f7;
}

body { 
  background: var(--bg); 
  color: var(--silver); 
  font-family: 'Inter', sans-serif; 
  margin: 0; 
  -webkit-font-smoothing: antialiased; 
}

/* OVERRIDE TAILWIND FOR HIGH CONTRAST */
.text-white { color: var(--white) !important; }
.text-gray-400, .text-gray-500 { color: var(--dim) !important; }
.text-gray-300 { color: var(--silver) !important; }
.bg-gray-900 { background-color: var(--s1) !important; }
.border-gray-800 { border-color: var(--border) !important; }
.font-mono { font-family: 'IBM Plex Mono', monospace !important; }

/* MISSION BOX ARCHITECTURE */
.data-box {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  position: relative;
  overflow: hidden;
}
.data-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0; width: 4px;
  background: var(--accent, var(--blue));
}
.db-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--accent, var(--blue));
  margin-bottom: 8px;
}
.db-value {
  font-size: 24px;
  font-weight: 900;
  color: var(--white);
  letter-spacing: -0.03em;
  line-height: 1.2;
}
.db-sub {
  font-size: 13px;
  color: var(--dim);
  font-weight: 600;
  margin-top: 4px;
}

/* BULLETS */
.bullet-list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.bullet { display: flex; gap: 12px; font-size: 14px; color: var(--silver); align-items: flex-start; font-weight: 500; }
.bullet::before { content: '»'; font-weight: 900; color: var(--accent, var(--blue)); font-family: 'IBM Plex Mono', monospace; font-size: 16px; margin-top: -2px; }

/* PILLS */
.pill { display: inline-flex; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
.pill-red { background: rgba(255,77,77,0.15); color: var(--red); border: 1px solid rgba(255,77,77,0.4); }
.pill-gold { background: rgba(251,191,36,0.15); color: var(--gold); border: 1px solid rgba(251,191,36,0.4); }
.pill-green { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.4); }
.pill-blue { background: rgba(96,165,250,0.15); color: var(--blue); border: 1px solid rgba(96,165,250,0.4); }
