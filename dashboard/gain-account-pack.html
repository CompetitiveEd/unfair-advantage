<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIN Account Pack — GlobalFin Corp | Project Alpha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* CORE VARIABLES (100% Solid, No Opacity) */
:root {
  --bg: #020617; 
  --s1: #0f172a; 
  --border: rgba(255,255,255,0.15);
  --white: #ffffff;
  --silver: #e2e8f0;
  --dim: #cbd5e1; /* High-lume silver, no dark grey */
  --red: #f87171;      
  --gold: #fbbf24;     
  --blue: #93c5fd;     
  --green: #4ade80;    
  --purple: #c084fc;
}

body {
  background-color: var(--bg);
  color: var(--silver);
  font-family: 'Inter', sans-serif;
  margin: 0;
  -webkit-font-smoothing: antialiased;
}

/* FORCE TAILWIND OVERRIDES TO PREVENT MUDDY COLORS */
#gain-dashboard-root .bg-gray-900, 
#gain-dashboard-root .bg-gray-950,
#gain-dashboard-root [class*="bg-gray-900/"],
#gain-dashboard-root [class*="bg-gray-950/"] { 
  background-color: var(--s1) !important; 
}
#gain-dashboard-root .border-gray-800 { border-color: var(--border) !important; }

/* Ban dark greys */
#gain-dashboard-root .text-gray-600,
#gain-dashboard-root .text-gray-500,
#gain-dashboard-root .text-gray-400 { color: var(--dim) !important; }
#gain-dashboard-root .text-gray-300,
#gain-dashboard-root .text-gray-200 { color: var(--silver) !important; }

/* Force High-Lume Accents */
#gain-dashboard-root .text-red-500, #gain-dashboard-root .text-red-400 { color: var(--red) !important; }
#gain-dashboard-root .text-amber-500, #gain-dashboard-root .text-amber-400 { color: var(--gold) !important; }
#gain-dashboard-root .text-blue-500, #gain-dashboard-root .text-blue-400 { color: var(--blue) !important; }
#gain-dashboard-root .text-emerald-500, #gain-dashboard-root .text-emerald-400 { color: var(--green) !important; }

/* Enforce Monospace */
#gain-dashboard-root .font-mono { font-family: 'IBM Plex Mono', monospace !important; }
</style>
</head>
<body>
<div id="gain-dashboard-root" style="max-width: 1200px; margin: 0 auto; padding: 24px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script>
  tailwind.config = {
    corePlugins: { preflight: false },
    important: '#gain-dashboard-root',
  }
</script>

<script type="text/babel" data-type="module">
const { useState } = React;

// ─── DATA (Sanitized & Condensed for High Signal) ───
const ACCOUNT = {
  name: "GlobalFin Corp",
  sector: "Insurance-Led Multi-Line FS",
  dealValue: "£115M",
  acv: "£16.4M/yr",
  term: "7 Years",
  status: "LIVE BID",
  winProbability: 32,
  rfp: "GFC-2026-001",
  verdict: "KILL STANDALONE — PIVOT TO RFP",
  dealType: "Board Audit Committee has frozen all IT CAPEX. Only active budget is £2.3M inside RFP."
};

const STAKEHOLDERS = [
  {
    id: "pemberton", name: "Sir Richard Hastings", role: "Audit Chair", level: "Board",
    status: "unknown", authority: 100, influence: 100,
    summary: "Ultimate veto holder. Used Big4 audit to freeze CIO's CAPEX. Must frame as 'Regulatory Remediation'.",
    trigger: "Audit-grade evidence. Regulatory frameworks."
  },
  {
    id: "thompson", name: "Marcus Thorne", role: "CFO", level: "C-Suite",
    status: "targeted", authority: 100, influence: 90,
    summary: "Economic buyer. Brought Big4 in deliberately to freeze budget. Requires first-number rigour.",
    trigger: "£2.8M OPEX bleed mapped to at-risk provisions."
  },
  {
    id: "morris", name: "Jennifer Mason", role: "Dir. Operational Resilience", level: "Senior",
    status: "champion", authority: 30, influence: 80,
    summary: "Powerless champion (cannot sign POs) but acts as the conduit to the regulatory budget.",
    trigger: "Peer credibility. Practical frameworks."
  },
  {
    id: "reid", name: "Nicholas Reed", role: "CIO", level: "C-Suite",
    status: "targeted", authority: 4, influence: 70,
    summary: "BIGGEST SABOTAGE RISK. Loyalty to incumbent LegacyTech. Financially neutered by CFO.",
    trigger: "Governance Shield narrative. SIAM-as-a-Service."
  }
];

const SCORING = {
  helios: 4.15, target: 4.80, tesseract: 3.30, globalSI: 3.55,
  criteria: [
    { code: "TC-04", label: "Op Resilience", weight: 5.4, us: 5, legacy: 2, global: 3, play: "LOCK" },
    { code: "CC-02", label: "Gain-Share", weight: 7.2, us: 5, legacy: 3, global: 3, play: "LOCK" },
    { code: "TC-01", label: "Infra Baseline", weight: 12.6, us: 4, legacy: 4, global: 4, play: "PUSH" },
    { code: "CC-01", label: "Commercial Model", weight: 9.6, us: 4, legacy: 3, global: 4, play: "PUSH" },
  ],
};

// ─── UTILITY COMPONENTS ───

const StatusDot = ({ status }) => {
  const colors = {
    champion: "bg-[#4ade80]",
    established: "bg-[#4ade80]",
    targeted: "bg-[#fbbf24]",
    unknown: "bg-[#93c5fd]",
  };
  return <span className={`inline-block w-3 h-3 rounded-full ${colors[status] || colors.unknown}`} />;
};

const Badge = ({ children, color = "blue" }) => {
  const styles = {
    blue: "border-[#93c5fd] text-[#93c5fd]",
    red: "border-[#f87171] text-[#f87171]",
    green: "border-[#4ade80] text-[#4ade80]",
    amber: "border-[#fbbf24] text-[#fbbf24]",
  };
  return (
    <span className={`inline-block px-3 py-1 text-[11px] font-bold uppercase tracking-widest border rounded bg-[#0f172a] ${styles[color]}`}>
      {children}
    </span>
  );
};

const Section = ({ id, title, subtitle, children, defaultOpen = false }) => {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="mb-6 border border-white/15 rounded-lg overflow-hidden bg-[#0f172a]">
      <button
        onClick={() => setOpen(!open)}
        className="w-full flex items-center justify-between px-6 py-5 bg-[#1e293b] hover:bg-[#334155] transition-colors text-left border-b border-white/10"
      >
        <div>
          <span className="text-[12px] font-bold text-[#93c5fd] uppercase tracking-widest block font-mono mb-1">{id}</span>
          <span className="text-xl font-extrabold text-white">{title}</span>
        </div>
        <span className={`text-[#cbd5e1] text-xl transform transition-transform duration-200 ${open ? "rotate-180" : ""}`}>▼</span>
      </button>
      {open && <div className="p-6 bg-[#0f172a]">{children}</div>}
    </div>
  );
};

// ─── MAIN DASHBOARD ───

function GAINAccountPack() {
  const [activeTab, setActiveTab] = useState("exec");
  const [selectedPerson, setSelectedPerson] = useState(null);

  const tabs = [
    { id: "exec", label: "01 // Exec Summary" },
    { id: "gather", label: "02 // Topology" },
    { id: "influence", label: "03 // Strategy" },
  ];

  return (
    <div className="min-h-screen text-[#cbd5e1] font-sans">
      
      {/* ─── HEADER ─── */}
      <div className="border-b border-white/15 pb-8 mb-8 pt-4">
        <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
          <div>
            <div className="flex items-center gap-4 mb-3">
              <span className="text-[12px] font-bold text-[#f87171] uppercase tracking-[0.2em] font-mono">// MISSION UNIT: {ACCOUNT.rfp}</span>
              <span className="inline-flex items-center gap-2 px-3 py-1 bg-[#0f172a] border border-[#f87171] rounded text-[11px] font-bold text-[#f87171] uppercase tracking-wider">
                <span className="w-2 h-2 bg-[#f87171] rounded-full animate-pulse" />
                {ACCOUNT.status}
              </span>
            </div>
            <h1 className="text-5xl font-black text-white tracking-tight mb-2">{ACCOUNT.name}</h1>
            <p className="text-sm text-[#cbd5e1] font-semibold">{ACCOUNT.sector} · {ACCOUNT.term} · ACV: {ACCOUNT.acv}</p>
          </div>
          <div className="text-right">
            <div className="text-[12px] text-[#cbd5e1] uppercase tracking-widest font-bold font-mono mb-1">Win Probability</div>
            <div className="text-6xl font-black text-white">{ACCOUNT.winProbability}%</div>
          </div>
        </div>
      </div>

      {/* ─── TABS ─── */}
      <div className="flex gap-2 border-b border-white/10 mb-8 overflow-x-auto">
        {tabs.map((t) => (
          <button key={t.id} onClick={() => setActiveTab(t.id)}
            className={`px-8 py-4 text-left border-b-4 transition-all shrink-0 font-mono text-[12px] font-bold tracking-widest uppercase ${
              activeTab === t.id
                ? "border-[#f87171] text-white bg-white/5"
                : "border-transparent text-[#cbd5e1] hover:text-white hover:bg-white/5"
            }`}
          >
            {t.label}
          </button>
        ))}
      </div>

      {/* ─── CONTENT ─── */}
      <div className="py-2">

        {/* ════════════════════════════════════════════════ */}
        {/* EXEC SUMMARY TAB */}
        {/* ════════════════════════════════════════════════ */}
        {activeTab === "exec" && (
          <div>
            <Section id="VERDICT" title="The Bottom Line" defaultOpen={true}>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-[#0f172a] border-l-4 border-[#f87171] p-6 border-y border-r border-white/15 rounded-r-lg">
                  <div className="text-[12px] text-[#f87171] font-bold uppercase tracking-widest font-mono mb-2">Primary Action</div>
                  <div className="text-2xl font-black text-white mb-2">{ACCOUNT.verdict}</div>
                  <p className="text-[15px] font-medium text-[#cbd5e1]">{ACCOUNT.dealType}</p>
                </div>
                <div className="bg-[#0f172a] border-l-4 border-[#fbbf24] p-6 border-y border-r border-white/15 rounded-r-lg">
                  <div className="text-[12px] text-[#fbbf24] font-bold uppercase tracking-widest font-mono mb-2">Critical Threat</div>
                  <div className="text-2xl font-black text-white mb-2">Operation Meridian</div>
                  <p className="text-[15px] font-medium text-[#cbd5e1]">Client suffers from £67M historical failure PTSD. Zero trust in "Big Bang" vendor promises.</p>
                </div>
              </div>
            </Section>

            <Section id="FINANCIALS" title="Financial Forensics" defaultOpen={true}>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                {[
                  { label: "Total Value", value: ACCOUNT.dealValue, color: "text-white" },
                  { label: "Annual Value", value: ACCOUNT.acv, color: "text-[#93c5fd]" },
                  { label: "Cost of Inaction", value: "£13.8M", color: "text-[#f87171]" },
                  { label: "Innovation Fund", value: "£2.3M", color: "text-[#fbbf24]" },
                ].map((v, i) => (
                  <div key={i} className="bg-[#0f172a] border border-white/15 rounded-lg p-5">
                    <div className="text-[11px] text-[#cbd5e1] uppercase tracking-widest font-bold mb-2 font-mono">{v.label}</div>
                    <div className={`text-3xl font-black ${v.color}`}>{v.value}</div>
                  </div>
                ))}
              </div>
            </Section>

            <Section id="ACTIONS" title="Immediate Actions" defaultOpen={true}>
              <div className="space-y-4">
                {[
                  { action: "Build named-process cost glide path (+0.29 weighted pts)", status: "REQUIRED" },
                  { action: "Secure Client Infrastructure Transition Blueprint", status: "REQUIRED" },
                  { action: "Rehearse live alert-methodology scenario with Infra Lead", status: "REQUIRED" },
                ].map((a, i) => (
                  <div key={i} className="flex items-center gap-4 bg-[#0f172a] border border-white/15 p-4 rounded-lg">
                    <span className="text-[#f87171] font-black text-xl">»</span>
                    <span className="text-[15px] font-bold text-white flex-1">{a.action}</span>
                    <Badge color="red">{a.status}</Badge>
                  </div>
                ))}
              </div>
            </Section>
          </div>
        )}

        {/* ════════════════════════════════════════════════ */}
        {/* TOPOLOGY TAB */}
        {/* ════════════════════════════════════════════════ */}
        {activeTab === "gather" && (
          <div>
            <Section id="WHO" title="Stakeholder Mapping" defaultOpen={true}>
              <div className="flex flex-wrap gap-3 mb-6">
                {STAKEHOLDERS.map(s => (
                  <button key={s.id} onClick={() => setSelectedPerson(selectedPerson === s.id ? null : s.id)}
                    className={`border rounded-lg px-4 py-3 text-center transition-all cursor-pointer ${
                      selectedPerson === s.id ? "bg-[#1e293b] border-[#ffffff]" :
                      "bg-[#0f172a] border-white/15 hover:border-white/40"
                    }`}>
                    <div className="flex items-center gap-2 mb-1">
                      <StatusDot status={s.status} />
                      <span className="text-[14px] font-bold text-white">{s.name}</span>
                    </div>
                    <span className="text-[11px] text-[#cbd5e1] uppercase font-mono font-bold">{s.role}</span>
                  </button>
                ))}
              </div>
              
              {selectedPerson && (() => {
                const p = STAKEHOLDERS.find(s => s.id === selectedPerson);
                if (!p) return null;
                return (
                  <div className="bg-[#1e293b] border border-white/30 rounded-lg p-6">
                    <div className="flex flex-wrap items-center gap-3 mb-4">
                      <StatusDot status={p.status} />
                      <span className="text-2xl font-black text-white">{p.name}</span>
                      <span className="text-[14px] font-bold text-[#cbd5e1] uppercase">{p.role}</span>
                    </div>
                    <p className="text-[16px] text-white font-medium mb-6">{p.summary}</p>
                    <div className="bg-[#0f172a] border border-white/15 rounded p-4 border-l-4 border-[#4ade80]">
                      <div className="text-[12px] text-[#4ade80] uppercase font-bold mb-1 font-mono">Trigger Strategy</div>
                      <div className="text-[15px] font-bold text-white">{p.trigger}</div>
                    </div>
                  </div>
                );
              })()}
            </Section>
          </div>
        )}

        {/* ════════════════════════════════════════════════ */}
        {/* STRATEGY TAB */}
        {/* ════════════════════════════════════════════════ */}
        {activeTab === "influence" && (
          <div>
            <Section id="SCORING" title="Competitive Scoring Strategy" defaultOpen={true}>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse bg-[#0f172a] border border-white/15 rounded-lg overflow-hidden">
                  <thead>
                    <tr>
                      <th className="font-mono text-[12px] text-white uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Criterion</th>
                      <th className="font-mono text-[12px] text-white uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Weight</th>
                      <th className="font-mono text-[12px] text-[#4ade80] uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Us</th>
                      <th className="font-mono text-[12px] text-[#f87171] uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Legacy</th>
                      <th className="font-mono text-[12px] text-[#fbbf24] uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Global SI</th>
                      <th className="font-mono text-[12px] text-white uppercase font-bold p-4 bg-[#1e293b] border-b border-white/15">Play</th>
                    </tr>
                  </thead>
                  <tbody>
                    {SCORING.criteria.map((c, i) => (
                      <tr key={i} className="border-b border-white/10">
                        <td className="p-4 text-[14px] font-bold text-white">{c.label}</td>
                        <td className="p-4 text-[14px] font-bold text-[#cbd5e1]">{c.weight}%</td>
                        <td className="p-4 text-[16px] font-black text-[#4ade80]">{c.us}</td>
                        <td className="p-4 text-[16px] font-black text-[#f87171]">{c.legacy}</td>
                        <td className="p-4 text-[16px] font-black text-[#fbbf24]">{c.global}</td>
                        <td className="p-4"><Badge color={c.play === "LOCK" ? "green" : "blue"}>{c.play}</Badge></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </Section>

            <Section id="THEMES" title="Positioning Wedges" defaultOpen={true}>
               <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-[#0f172a] border-l-4 border-[#fbbf24] p-6 border-y border-r border-white/15 rounded-r-lg">
                  <div className="text-[12px] text-[#fbbf24] font-bold uppercase tracking-widest font-mono mb-2">WIN THEME 01</div>
                  <div className="text-2xl font-black text-white mb-2">The Regulatory Rescue</div>
                  <p className="text-[15px] font-medium text-[#cbd5e1]">We are a regulatory remediation partner that happens to manage technology. Target: Audit Chair.</p>
                </div>
                <div className="bg-[#0f172a] border-l-4 border-[#93c5fd] p-6 border-y border-r border-white/15 rounded-r-lg">
                  <div className="text-[12px] text-[#93c5fd] font-bold uppercase tracking-widest font-mono mb-2">WIN THEME 02</div>
                  <div className="text-2xl font-black text-white mb-2">SIAM-as-a-Service</div>
                  <p className="text-[15px] font-medium text-[#cbd5e1]">Project Alpha manages LegacyTech. Neutralises the CIO sabotage risk by keeping his vendor alive under us.</p>
                </div>
              </div>
            </Section>
          </div>
        )}
      </div>

    </div>
  );
}

// Mount dashboard
window.mountDashboard = function() {
  var dashRoot = document.getElementById('gain-dashboard-root');
  if (dashRoot && !dashRoot._mounted) {
    ReactDOM.createRoot(dashRoot).render(React.createElement(AccountPack));
    dashRoot._mounted = true;
  }
};
setTimeout(function() { if (window.mountDashboard) window.mountDashboard(); }, 100);
</script>

</body>
</html>
